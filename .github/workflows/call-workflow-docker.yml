name: Reuse workflows Publish Docker image

on:
  workflow_dispatch: # Manual trigger from GitHub Actions UI

jobs:
  call-workflow:
    permissions:
      contents: read
      packages: write # Required for push to GitHub Registry (GHCR)
      attestations: write # Required for provenance
      id-token: write # Required for modern attestations/provenances (OIDC)
      artifact-metadata: write # Required to create the artifact storage record.
    # owner/repository/.github/workflows/workflows.yml@main' or '././.github/workflows/workflows.yml' for local workflows
    uses: ./.github/workflows/docker.yml
#    uses: gamegine/github-actions-docker-push/.github/workflows/print-vars.yml@test
#    uses: gamegine/github-actions-docker-push/.github/workflows/docker.yml@test
    with:
      USE_GITHUB_REGISTRY: true
    secrets:
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
      DOCKER_REGISTRY_TOKEN: ${{ secrets.DOCKER_REGISTRY_TOKEN }}
  output:
    runs-on: ubuntu-latest
    needs: call-workflow
    steps:
      - name: Show output
        run: |
          echo "Images name: ${{ needs.call-workflow.outputs.image_name }}"
          echo "Images tags: ${{ needs.call-workflow.outputs.image_tags }}"
          echo "Images digest: ${{ needs.call-workflow.outputs.image_digest }}"
          echo "Signed OCI image references: ${{ needs.call-workflow.outputs.cosign_images }}"
