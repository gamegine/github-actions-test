name: job outputs
on:
  workflow_dispatch: # Manual trigger from GitHub Actions UI
jobs:
  build:
    runs-on: ubuntu-slim
    steps:
      - name: Generate data
        id: generate
        run: echo "DATA=ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}" >> $GITHUB_OUTPUT

      - name: outputs
        run: echo "${{ toJSON(steps.generate.outputs) }}"
      - name: outputs img
        run: echo ${{ steps.generate.outputs.DATA }}

      - name: Fake metadata-action output
        id: meta
        run: |
          {
            echo 'tags<<EOF'
            echo 'oxoato/github-actions-docker-push:main'
            echo 'oxoato/github-actions-docker-push:latest'
            echo 'oxoato/github-actions-docker-push:sha-892ddcc'
            echo 'ghcr.io/gamegine/github-actions-docker-push:main'
            echo 'ghcr.io/gamegine/github-actions-docker-push:latest'
            echo 'ghcr.io/gamegine/github-actions-docker-push:sha-892ddcc'
            echo 'registry.example.com/gamegine/test-image:v1.0.0'
            echo 'registry.example.com/gamegine/test-image:latest'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
    
      - name: Prepare images for Cosign
        id: cosign
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: "digest-xxx"
        run: |
          images=()
          while IFS= read -r tag; do
            img="${tag%:*}" # Remove tag (:main, :latest, :sha-xxxx, ...)
            # Add docker.io when no registry is specified
            if [[ "$img" == *.*/* ]]; then
              images+=("${img}@${DIGEST}")
            else
              images+=("docker.io/${img}@${DIGEST}")
            fi
          done <<< "$TAGS"
          # Remove duplicates
          mapfile -t images < <(printf '%s\n' "${images[@]}" | sort -u)
          # Export output
          {
            echo 'images<<EOF'
            printf '%s\n' "${images[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          echo "Images to sign:"
          printf '  %s\n' "${images[@]}"

      - name: Prepare images for Cosign 2
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: digest-xxx
        run: |
          images=$(while read -r tag; do
            img=${tag%:*}
            [[ $img == *.*/* ]] || img=docker.io/$img
            echo "$img@$DIGEST"
          done <<< "$TAGS" | sort -u)
          printf 'images<<EOF\n%s\nEOF\n' "$images" >> "$GITHUB_OUTPUT"
          printf 'Images to sign:\n  %s\n' "$images"
