name: print vars
on:
  workflow_dispatch: # Manual trigger from GitHub Actions UI
    inputs:
      text:
        required: false
        type: string
        default: 'text'
  workflow_call:
    inputs:
      text:
        required: false
        type: string
        default: 'text'
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: print
        env:
          ref: ${{ github.job_workflow_ref }}"
        run: |
          echo "repository=${{ github.repository }}"
          echo "workflow_ref=${{ github.workflow_ref }}"
          echo "job_workflow_ref=${{ github.job_workflow_ref }}"
          echo "job_workflow_ref=${{ job.workflow_ref }}"
          echo input text: ${{ inputs.text }}
      - name: env
        run: env
      - name: github
        run: echo ${{ github }}"
